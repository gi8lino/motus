---
name: Unit Tests

on:
  workflow_call:
  pull_request:
    branches:
      - main
    paths:
      - "internal/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - "examples/**"
      - "scripts/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: motus
          POSTGRES_PASSWORD: motus
          POSTGRES_DB: motus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motus -d motus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MOTUS_TEST_DATABASE_URL: postgres://motus:motus@localhost:5432/motus_test?sslmode=disable

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install Dependencies
        run: |
          make download

      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run typecheck
          npm run lint
          npm run format:check
          npm run build

      - name: Check formatting and exercise YAML
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...
          ruby scripts/check-core-exercises.rb
          git diff --check

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

      - name: Run Unit Tests
        run: |
          make test
