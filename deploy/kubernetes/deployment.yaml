---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: motus
  namespace: motus
  labels:
    app.kubernetes.io/name: motus
    app.kubernetes.io/component: motus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: motus
      app.kubernetes.io/component: motus
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: motus
        app.kubernetes.io/component: motus
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: motus
          image: ghcr.io/gi8lino/motus:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Zurich
            - name: MOTUS__AUTH_MODE
              value: local
            - name: MOTUS__PUBLIC_URL
              value: https://motus.example.com
            - name: MOTUS__LISTEN_ADDRESS
              value: 0.0.0.0:8080
            - name: MOTUS__MANAGEMENT_LISTEN_ADDRESS
              value: 0.0.0.0:8081
          envFrom:
            - secretRef:
                name: motus-db-url
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /healthz
              port: management
            failureThreshold: 30
            timeoutSeconds: 2
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            failureThreshold: 3
            timeoutSeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: management
            failureThreshold: 2
            periodSeconds: 30
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 100m
      restartPolicy: Always
      automountServiceAccountToken: false
