---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: motus
  namespace: motus
spec:
  parentRefs:
    - name: external
  hostnames:
    - motus.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: motus
          port: 8080
